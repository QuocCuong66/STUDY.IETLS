<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="KHÓA HỌC IELTS 4 KỸ NĂNG - ĐĂNG NHẬP">
    <title>Đăng Nhập - KHÓA HỌC IELTS 4 KỸ NĂNG</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="div1">
        <form onsubmit="return login()">
            <h1>ĐĂNG NHẬP</h1>
            <div class="input-box">
                <input type="text" id="username" placeholder="Tài khoản" required autocomplete="username">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Mật khẩu" required autocomplete="current-password">
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">Nhớ mật khẩu</label>
                <a href="#">Quên mật khẩu</a>
            </div>
            <button type="submit" class="btn">ĐĂNG NHẬP</button>
            <div class="register">
                <p>CHƯA CÓ TÀI KHOẢN - <a href="#">Đăng ký ngay</a></p>
            </div>
        </form>
    </div>

    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
