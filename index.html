<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="KHÓA HỌC IELTS 4 KỸ NĂNG - ĐĂNG NHẬP">
    <title>Đăng Nhập & Đăng Ký - KHÓA HỌC IELTS 4 KỸ NĂNG</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <div class="div1">
        <!-- LOGIN FORM -->
        <div id="login-box">
            <form id="login-form">
                <h1>ĐĂNG NHẬP</h1>
                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required autocomplete="email">
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Mật khẩu" required
                        autocomplete="current-password">
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" id="remember">Ghi nhớ đăng nhập</label>
                    <a href="#" id="forgot-password">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn">ĐĂNG NHẬP</button>
                <div class="register">
                    <p>CHƯA CÓ TÀI KHOẢN? <a href="#" id="show-register">Đăng ký ngay</a></p>
                </div>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-box" hidden>
            <form id="register-form">
                <h1>TẠO TÀI KHOẢN</h1>
                <div class="input-box">
                    <input type="text" id="reg-name" placeholder="Họ và tên" required autocomplete="name">
                    <i class="bx bxs-user-plus"></i>
                </div>
                <div class="input-box">
                    <input type="email" id="reg-email" placeholder="Email" required autocomplete="email">
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required
                        minlength="6" autocomplete="new-password">
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-confirm-password" placeholder="Xác nhận mật khẩu" required
                        minlength="6" autocomplete="new-password">
                    <i class="bx bxs-check-shield"></i>
                </div>
                <button type="submit" class="btn" style="background: linear-gradient(45deg, #4ECDC4, #FF6B6B);">TẠO TÀI
                    KHOẢN</button>
                <div class="register">
                    <p>ĐÃ CÓ TÀI KHOẢN? <a href="#" id="show-login">Đăng nhập ngay</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
