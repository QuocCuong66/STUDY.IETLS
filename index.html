<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/frontend/">
    <script>if (window.location.pathname === '/' || window.location.pathname === '/index.html') { window.location.replace('/frontend/'); }</script>
    <meta property="og:title" content="KHÓA HỌC IELTS 4 KỸ NĂNG - ĐĂNG NHẬP">
    <title>Đăng Nhập & Đăng Ký - KHÓA HỌC IELTS 4 KỸ NĂNG</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="div1">
        <!-- LOGIN FORM -->
        <div id="login-box">
            <form onsubmit="login(event)">
                <h1>ĐĂNG NHẬP</h1>
                <div class="input-box">
                    <input type="text" id="username" placeholder="Tài khoản" required autocomplete="username">
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Mật khẩu" required autocomplete="current-password">
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox">Nhớ mật khẩu</label>
                    <a href="#" onclick="alert('Vui lòng liên hệ giảng viên hoặc quản trị viên để lấy lại mật khẩu!')">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn">ĐĂNG NHẬP</button>
                <div class="register">
                    <p>CHƯA CÓ TÀI KHOẢN? <a href="javascript:void(0)" onclick="showRegisterForm()">Đăng ký ngay</a></p>
                </div>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-box" style="display: none;">
            <form onsubmit="register(event)">
                <h1>TẠO TÀI KHOẢN</h1>
                <div class="input-box">
                    <input type="text" id="reg-username" placeholder="Tên tài khoản mới" required autocomplete="username">
                    <i class="bx bxs-user-plus"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-password" placeholder="Mật khẩu" required autocomplete="new-password">
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-confirm-password" placeholder="Xác nhận mật khẩu" required autocomplete="new-password">
                    <i class="bx bxs-check-shield"></i>
                </div>
                <button type="submit" class="btn" style="background: linear-gradient(45deg, #4ECDC4, #FF6B6B);">TẠO TÀI KHOẢN</button>
                <div class="register">
                    <p>ĐÃ CÓ TÀI KHOẢN? <a href="javascript:void(0)" onclick="showLoginForm()">Đăng nhập ngay</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
